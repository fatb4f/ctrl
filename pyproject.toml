[project]
name = "ctrl-workspace"
version = "0.0.0"
description = "Development workspace for the ctrl qualification monorepo"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false
override-dependencies = ["cyclopts>=4.22,<5"]

[tool.uv.workspace]
members = [
  "packages/ppf",
  "packages/runtime",
  "agents/tdd",
]

[dependency-groups]
test = [
  "ansible-core>=2.19,<2.20",
  "ansible-runner>=2.4,<3",
  "hypothesis>=6.138,<7",
  "hypothesis-jsonschema>=0.23.1,<1",
  "libcst>=1.8,<2",
  "packaging>=25",
  "pytest>=9.1,<10",
  "pytest-cov>=7,<8",
  "pyyaml>=6,<7",
]
quality = [
  "ruff>=0.14,<1",
  "ty>=0.0.1a24",
]
codegen = [
  "datamodel-code-generator==0.71.0",
]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
  { include-group = "codegen" },
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/ppf/tests", "packages/runtime/tests", "agents/tdd/tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
  "packages/ppf/src/ppf/generated",
  "packages/runtime/src/runtime_promptgen/generated",
  "packages/ppf/.codex/skills/python-policy-ppf",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
exclude = [
  "packages/ppf/src/ppf/generated",
  "packages/runtime/src/runtime_promptgen/generated",
]
