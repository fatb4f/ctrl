[project]
name = "ctrl"
version = "0.1.0"
description = "Federated qualification prototype control plane."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "_404", email = "_404@example.com" },
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/fatb4f/ctrl"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/ppf",
  "packages/runtime",
  "packages/qualification-workflow",
  "agents/tdd",
]

[dependency-groups]
test = [
  "packaging>=25",
  "pytest>=9",
  "pytest-cov>=7",
  "PyYAML>=6",
]
quality = [
  "ruff>=0.14",
  "ty>=0.0.1a24",
]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
  ".codex",
  "**/generated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
exclude = [
  "packages/ppf/src/ppf/generated",
]
