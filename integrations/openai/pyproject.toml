[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "sdk-feedback"
version = "0.1.0"
description = "POC for CPython Lib adapters and Python tooling."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "_404", email = "_404@example.com" },
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/_404/sdk-feedback"

[dependency-groups]
test = [
  "packaging>=25",
  "pytest>=9",
  "pytest-cov>=7",
  "PyYAML>=6",
]
quality = [
  "ruff>=0.14",
  "ty>=0.0.1a24",
]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
