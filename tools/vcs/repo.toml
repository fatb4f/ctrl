# Installed by `just jj-init` as repository-local, machine-local configuration.
# Identity and credentials are intentionally absent.

[revset-aliases]
"trunk()" = "main@gerrit"
"immutable_heads()" = "builtin_immutable_heads() | present(main@gerrit) | tags() | remote_bookmarks()"

[templates]
commit_trailers = "format_gerrit_change_id_trailer(self)"

[git]
auto-local-bookmark = false
