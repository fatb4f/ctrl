- job:
    name: ctrl-base
    parent: base
    timeout: 3600
    nodeset: ctrl-static-worker
    required-projects:
      - ctrl
    pre-run: ops/zuul/playbooks/pre.yaml

- job:
    name: ctrl-check
    parent: ctrl-base
    run: ops/zuul/playbooks/check.yaml

- job:
    name: ctrl-gate
    parent: ctrl-base
    timeout: 7200
    run: ops/zuul/playbooks/gate.yaml

- job:
    name: ctrl-periodic
    parent: ctrl-base
    timeout: 10800
    run: ops/zuul/playbooks/periodic.yaml

- job:
    name: ctrl-release
    parent: ctrl-base
    timeout: 7200
    run: ops/zuul/playbooks/release.yaml

- nodeset:
    name: ctrl-static-worker
    nodes:
      - name: worker
        label: ctrl-worker
