[project]
name = "runtime-promptgen"
version = "0.1.1"
description = "Schema-validated runtime prompt composer"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "codex-handoff @ git+https://github.com/fatb4f/codex-handoff.git@v0.1.2",
  "cyclopts>=4.22,<5",
  "jsonschema[format]==4.25.1",
  "pydantic==2.13.4",
]

[dependency-groups]
test = [
  "datamodel-code-generator>=0.35.0",
  "hypothesis>=6.135.0",
  "hypothesis-jsonschema>=0.23.1",
  "pytest>=9.1.1",
  "ruff>=0.12.0",
]

[project.scripts]
promptgen = "runtime_promptgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_promptgen"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true
