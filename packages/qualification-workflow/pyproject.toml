[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "qualification-workflow"
version = "0.1.0"
description = "Generic qualification workflow parsing and snapshot compilation."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "markdown-it-py>=4,<5",
  "pydantic>=2.13,<3",
]

[dependency-groups]
test = ["pytest>=9,<10"]
quality = ["ruff>=0.14", "ty>=0.0.1a24"]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/qualification_workflow/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
