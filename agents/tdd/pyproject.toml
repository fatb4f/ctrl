[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "tdd-agent-skills"
version = "0.1.0"
description = "Seed package for obligation-governed, domain-specialized TDD agent skills."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "_404", email = "_404@example.com" },
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "cyclopts>=4,<5",
  "markdown-it-py>=4,<5",
  "pydantic>=2.13,<3",
  "pydantic-graph>=2.22,<3",
]

[project.scripts]
python-ppf = "tdd_agent_skills.cli:main"

[project.urls]
Repository = "https://github.com/fatb4f/tdd-agent-skills"

[dependency-groups]
test = [
  "packaging>=25",
  "pytest>=9",
  "pytest-cov>=7",
  "PyYAML>=6",
]
quality = [
  "ruff>=0.14",
  "ty>=0.0.1a24",
]
codegen = [
  "datamodel-code-generator>=0.71,<0.72",
]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
  { include-group = "codegen" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
