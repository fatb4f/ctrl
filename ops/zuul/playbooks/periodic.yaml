- hosts: all
  tasks:
    - name: Run clean-room qualification
      ansible.builtin.command:
        cmd: just qualify
        chdir: "{{ zuul.project.src_dir }}"
      changed_when: false
    - name: Run staging backup restoration probe
      ansible.builtin.command:
        cmd: /opt/ctrl-ops/bin/restore-probe --environment staging
      changed_when: false
