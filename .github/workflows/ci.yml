name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.0"
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0
      - run: go install cuelang.org/go/cmd/cue@v0.18.0-0.dev.0.20260713132914-0c547ba896a5
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: just sync
      - run: just tools-check
      - run: just qualify

  macos-command-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.0"
          python-version: "3.14"
      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0
      - run: go install cuelang.org/go/cmd/cue@v0.18.0-0.dev.0.20260713132914-0c547ba896a5
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: just sync
      - run: just tools-check
      - run: just check
      - run: just --dry-run ui
